<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login CMS | Gudang Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">CMS Gudang Digital</h1>
            <p class="text-sm text-gray-500 mt-2">Masuk untuk mengelola materi</p>
        </div>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <input type="text" id="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>
            
            <!-- Tempat Notifikasi Error -->
            <div id="alertMsg" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg border border-red-100"></div>
            
            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition flex justify-center items-center">
                <span>Masuk</span>
            </button>
        </form>
    </div>

    <script>
        // ==========================================================
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP (.gs) ANDA
        // ==========================================================
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbzD18vvYDhC2s9EyuhJlKQqhCwkOty5sYkUSu4dTwJKff4Yf4r317ZRijGWFTR287Fi/exec'; 

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const alertMsg = document.getElementById('alertMsg');
            
            btn.disabled = true;
            btn.innerHTML = 'Memproses...';
            alertMsg.classList.add('hidden');

            const payload = {
                action: 'login',
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                // Menggunakan text/plain untuk menghindari pesan error CORS di browser
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    // Set session token dan waktu saat ini
                    localStorage.setItem('cms_token', result.token);
                    localStorage.setItem('cms_timestamp', Date.now());
                    
                    // Arahkan ke halaman CMS
                    window.location.href = 'cms-materi.html';
                } else {
                    alertMsg.textContent = result.message;
                    alertMsg.classList.remove('hidden');
                }
            } catch (error) {
                alertMsg.textContent = 'Gagal menghubungi server. Pastikan URL Web App sudah benar dan sudah di-deploy ulang.';
                alertMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Masuk';
            }
        });
    </script>
</body>
</html>
