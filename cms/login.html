<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login CMS | Gudang Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="../icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icon/favicon-16x16.png">
    <link rel="manifest" href="../icon/site.webmanifest">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<!-- Perbaikan Mobile: Menambahkan min-h-screen dan p-4 agar ada jarak aman di kiri-kanan layar HP -->
<body class="bg-gradient-to-br from-gray-50 via-blue-50 to-gray-100 min-h-screen flex items-center justify-center p-4 sm:p-6 relative">
    
    <!-- Ornamen Background Opsional -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] bg-blue-400/10 blur-3xl rounded-full"></div>
        <div class="absolute top-[60%] -right-[10%] w-[40%] h-[40%] bg-indigo-400/10 blur-3xl rounded-full"></div>
    </div>

    <!-- Container Card Utama -->
    <div class="w-full max-w-md bg-white/95 backdrop-blur-sm p-8 sm:p-10 rounded-2xl shadow-2xl shadow-blue-900/5 border border-white">
        
        <!-- Header Section -->
        <div class="text-center mb-8">
            <!-- Ikon Admin/Login -->
            <div class="mx-auto w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-5 shadow-inner border border-blue-100">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">
                Pusat Kendali MGMP
            </h1>
            <p class="text-sm text-gray-500 mt-2 font-medium">
                Ruang Kendali Konten dan Administrasi Digital Pengurus MGMP Bahasa Indonesia
            </p>
        </div>
        
        <!-- Form Section -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <input type="text" id="username" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all text-sm font-medium text-gray-900" placeholder="Masukkan username" required>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1.5">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input type="password" id="password" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all text-sm font-medium text-gray-900" placeholder="••••••••" required>
                </div>
            </div>
            
            <!-- Tempat Notifikasi Error -->
            <div id="alertMsg" class="hidden text-sm text-red-600 bg-red-50 p-4 rounded-xl border border-red-100 font-medium flex gap-2 items-start">
                <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span id="alertText"></span>
            </div>
            
            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 shadow-lg shadow-blue-600/30 flex justify-center items-center mt-2">
                <span>Masuk ke Dasbor</span>
            </button>
        </form>
    </div>

    <script>
        // ==========================================================
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP (.gs) ANDA
        // ==========================================================
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbwDa7PvDzh6M0Tk2_EL1oippxy2M4QZHv-_xJUq9BeL5yYRV19GMfLbx7Ww328H2ujA/exec';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const alertMsg = document.getElementById('alertMsg');
            const alertText = document.getElementById('alertText');
            
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Memeriksa...`;
            alertMsg.classList.add('hidden');

            const payload = {
                action: 'login',
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    btn.innerHTML = `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Berhasil Masuk`;
                    btn.classList.replace('bg-blue-600', 'bg-green-600');
                    btn.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
                    btn.classList.replace('shadow-blue-600/30', 'shadow-green-600/30');

                    localStorage.setItem('cms_token', result.token);
                    localStorage.setItem('cms_timestamp', Date.now());
                    
                    // Delay sejenak agar user melihat pesan sukses sebelum pindah halaman
                    setTimeout(() => {
                        window.location.href = 'welcome.html';
                    }, 500);
                } else {
                    alertText.textContent = result.message;
                    alertMsg.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = 'Masuk ke Dasbor';
                }
            } catch (error) {
                alertText.textContent = 'Gagal menghubungi server. Pastikan Anda terhubung ke internet dan URL Web App sudah benar.';
                alertMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Masuk ke Dasbor';
            }
        });
    </script>
</body>
</html>
